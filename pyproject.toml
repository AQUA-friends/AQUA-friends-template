[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-friends-template"
version = "0.0.1"
description = "Template repository for an AQUA-friend"
readme = "README.md"
requires-python = "<=3.15"
authors = [
    {name = "Your Name", email = "you@example.com"},
]

# Runtime dependencies.
# `aqua-core` is the AQUA core library on PyPI (https://pypi.org/project/aqua-core/);
# its import name is `aqua`. It is a hard requirement of every AQUA-friend.

dependencies = [
    "aqua-core",
    "xarray",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 127
