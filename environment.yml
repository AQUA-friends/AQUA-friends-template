# OPTIONAL template: keep this file only if you need conda packages or binaries.
# Delete it otherwise. Remove the pip entries you do not need (see README).
# Create the environment:
# mamba env create -f environment.yml

name: aqua-friend
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.12,<3.15
  # aqua-core from conda-forge brings smmregrid (and CDO on Linux), eccodes, cartopy, netcdf4
  # on macOS install CDO with Homebrew (brew install cdo)
  - aqua-core>=1.2.3,<1.3.0
  - pip
  - pip:
    - aqua-diagnostics # only for coherence levels 2 and 3, remove it otherwise
    - -e .[dev]
